name: 'Validate Cloudflare Secrets'
description: 'Validate that a Cloudflare API token and CLOUDFLARE_ACCOUNT_ID are set (deploy-*-reusable ワークフロー共通のCloudflare認証情報チェック。呼び出し元ごとに用途で絞ったトークン secret を渡す — CLOUDFLARE_WORKERS_API_TOKEN / CLOUDFLARE_PAGES_API_TOKEN / CLOUDFLARE_D1_API_TOKEN 等)'

inputs:
  cloudflare-api-token:
    description: 'Cloudflare API token'
    required: true
  cloudflare-account-id:
    description: 'Cloudflare account ID'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate Cloudflare secrets
      shell: bash
      env:
        CF_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CF_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        missing=0
        if [ -z "$CF_API_TOKEN" ]; then
          echo "❌ Cloudflare API Token: NOT SET"
          missing=1
        else
          echo "✅ Cloudflare API Token: SET"
        fi
        if [ -z "$CF_ACCOUNT_ID" ]; then
          echo "❌ CLOUDFLARE_ACCOUNT_ID: NOT SET"
          missing=1
        else
          echo "✅ CLOUDFLARE_ACCOUNT_ID: SET"
        fi
        # CFOPS-09: 必須シークレットが空欄でも success 扱いになっていたため、
        # 「検証」の名の通り、未設定ならここでジョブを失敗させる
        # （後段のwrangler呼び出しで分かりにくく失敗するのを防ぐ）。
        if [ "$missing" -eq 1 ]; then
          echo "::error::Cloudflare secrets are missing. See above for details."
          exit 1
        fi

name: Backfill release_note Table (One-off)

# race-schedule（旧統合リポジトリ）・race-scheduler 両リポジトリの既存GitHub Releasesを
# release_note テーブルへ投入する、手動実行専用の一度きりの作業用ワークフロー。
# race-scheduleがprivate化されると匿名フェッチで過去リリース（v1.x）が参照できなく
# なるため、private化前にtest/production両方のD1へ投入しておく必要がある
# （scripts/release/backfillReleaseNotes.ts 参照）。
#
# migrations/ 配下には置いていない: packages/api/test/common/inMemoryD1.ts が
# 全マイグレーションを自動適用してコンポーネントテストの初期状態を作るため、
# 259件のデータ投入をマイグレーションにすると全テストの「空のDB」という前提が
# 壊れてしまう（実際に確認済み）。そのためCIワークフローからGitHub APIを
# 都度フェッチしてSQLを都度生成する方式にしている。
#
# INSERT OR IGNORE を使っているため、複数回実行しても安全（冪等）。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "投入先のD1環境"
        type: choice
        options: [ "test", "production" ]
        default: "test"

permissions:
  contents: read

jobs:
  backfill:
    name: "📦 Backfill release_note"
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-node: 'false'

      # 既定の secrets.GITHUB_TOKEN はこのリポジトリ（race-scheduler）にしかアクセスできず、
      # 分割元の race-schedule（private化済み）を対象に含めると HTTP 404 で失敗する。
      # race-schedule-bot App は race-schedule 側の各ワークフローでも同じ BOT_APP_ID で
      # 利用されており両リポジトリにインストール済みのため、App トークンをクロスリポジトリ
      # スコープで発行して両リポジトリを読めるようにする。
      - name: Create GitHub App Token
        uses: ./.github/actions/create-github-app-token
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: taichi6930
          repositories: race-schedule,race-scheduler

      - name: Generate backfill SQL
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun scripts/release/backfillReleaseNotes.ts > /tmp/backfill-release-notes.sql

      - name: Show generated SQL summary
        run: |
          echo "生成されたINSERT文: $(grep -c '^INSERT' /tmp/backfill-release-notes.sql) 件"

      - name: Apply backfill to D1
        working-directory: packages/db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.DB_ID }}
        run: |
          envsubst < wrangler.toml > wrangler.resolved.toml && mv wrangler.resolved.toml wrangler.toml
          bunx wrangler d1 execute DB --remote --env ${{ inputs.environment }} --file=/tmp/backfill-release-notes.sql

      - name: Verify row count
        working-directory: packages/db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler d1 execute DB --remote --env ${{ inputs.environment }} \
            --command "SELECT source_repo, COUNT(*) as count FROM release_note GROUP BY source_repo"

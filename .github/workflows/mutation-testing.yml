name: Mutation Testing

# packages/{core,admin,batch,api}（front除く全TSパッケージ。front はFlutter/Dartのため
# Stryker Mutatorの対象外。dbはマイグレーション専用でsrcが無いため対象外）に対する
# ミューテーションテスト（Stryker Mutator）を週次で実行し、結果をレポートするだけの
# 非ブロッキングなワークフロー。
#
# 背景: このリポジトリは C0/C1 カバレッジ100%を要件にしている
# （docs/README.md §8「カバレッジ要件」）が、行/分岐カバレッジは「そのコードが
# 実行されたか」しか見ておらず、「そのコードの振る舞いをテストが実際に検証しているか」
# は保証しない（例: アサーション漏れのテストでもカバレッジ上は100%になり得る）。
# ミューテーションテストはソースコードに小さな変異（比較演算子の反転・定数の変更等）を
# 注入し、既存のテストスイートがその変異を検知して落ちるか（＝ kill できるか）を機械的に
# 判定することで、アサーションの実効性を可視化する。
#
# bun test を直接サポートするミューテーションツールが無いため、Stryker の
# command runner（任意のテストコマンドを実行し終了コードで判定する汎用ランナー）を
# 使う（stryker.<pkg>.config.json）。1ミュータントごとに対象パッケージの単体テスト
# スイート全体を実行し直すため、PRごとに実行するには重すぎる
# （scheduled-tests.yml の sIT/UAT と同じ理由でスケジュール実行に分離している）。
#
# 各stryker.<pkg>.config.jsonのignorePatternsは、壊れたシンボリックリンク
# （private submoduleが本セッション・CIとも未checkoutのため、それを指す.claude/
# CLAUDE.md/AGENTS.md/aidlc-docs/docsは実体が無い）だけを除外し、兄弟パッケージや
# tests/は一切除外しない。api用configを作った際、`packages/db/migrations`
# （apiのin-memory D1セットアップが参照）と`tests/shared`（ファクトリ）を除外して
# dry-run自体が失敗する事故を実際に起こしており、パッケージ間の依存を安易に
# 「使ってなさそうだから」で除外しないことを教訓として全パッケージのconfigに反映している。
#
# thresholds.break は意図的に null（各stryker.<pkg>.config.json参照）にしており、
# スコアの高低に関わらずジョブは常に成功する。まずは結果を可視化して傾向を把握する
# ことを優先し、PRのブロッキング化（CIゲート）は別途判断する
# （audit/license-check等の既存の「まずは可視化」ジョブと同じ思想）。

on:
    schedule:
        # 毎週月曜 05:00 JST (日曜 20:00 UTC)。scheduled-tests.yml（毎日 06:00 UTC）・
        # health-check-data-freshness.yml（14:00 JST）と重複しない時間帯を選んでいる。
        - cron: "0 20 * * 0"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # CICD-30/31: 別ワークフロー同士が誤って同じグループに入らないよう、ワークフロー名を含める。
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # パッケージごとに別ジョブにしているのは、scheduled-tests.yml（uat-smoke/sit/audit）と
    # 同じ理由: 並列実行され、失敗Issueもパッケージ単位でdedupしたい（1ジョブにまとめると
    # 失敗の切り分け・Issueのタイトルが曖昧になる）。matrix化も検討したが、matrix jobの
    # `needs.<job>.result`は全legの集約（1つでも失敗すればfailure）にしかならず
    # パッケージ単位の判定ができないため、パッケージ間は明示的な個別ジョブを選んだ。
    # 唯一の例外がmutation-api: パッケージ内でさらにsrcサブディレクトリ単位のmatrixに
    # 分割している（1ジョブのままだと完走に約6時間かかるため）。この場合は
    # `needs.mutation-api.result`がshard横断の集約になる粒度の粗さを許容し、
    # Issue本文側で各shardのログを個別に走査して原因箇所を特定する設計にしている
    # （詳細はmutation-apiジョブのコメントとreport-mutation-failureジョブ内を参照）。
    mutation-core:
        runs-on: ubuntu-24.04
        # ローカル実測（4コア環境）で約3〜4分/727ミュータント。packages/core全体
        # （約6,500ミュータント想定）では30〜60分程度を見込むが、GitHub-hosted runnerの
        # コア数・負荷次第で変動するため大きめに確保する。
        timeout-minutes: 90
        env:
            NODE_ENV: ci_github_actions
            CI: "true"
            TZ: jst
            HTML_FETCH_DELAY_MS: "0"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  filter: blob:none

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace
              with:
                  setup-node: "false"

            - name: Run mutation testing (packages/core)
              run: bun run mutation:core | tee mutation-report.log

            - name: Write job summary
              if: always()
              run: |
                  {
                    echo "## Mutation Testing (packages/core)"
                    echo ""
                    echo '```'
                    grep -B2 "^All files" mutation-report.log || echo "(結果テーブルを取得できませんでした。詳細はログを参照してください)"
                    echo '```'
                    echo ""
                    echo "詳細は本ジョブの \`mutation-report-core\` artifact（HTMLレポート）を参照してください。"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-report-core
                  path: |
                      reports/mutation/core/
                      mutation-report.log
                  retention-days: 7
                  if-no-files-found: warn

    mutation-admin:
        runs-on: ubuntu-24.04
        # ローカル実測: packages/admin全体で508ミュータント、テストスイート実行~0.4秒/回と
        # 軽量。数分〜十数分程度を見込むが、初回の実挙動確認までは大きめに確保する。
        timeout-minutes: 30
        env:
            NODE_ENV: ci_github_actions
            CI: "true"
            TZ: jst
            HTML_FETCH_DELAY_MS: "0"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  filter: blob:none

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace
              with:
                  setup-node: "false"

            - name: Run mutation testing (packages/admin)
              run: bun run mutation:admin | tee mutation-report.log

            - name: Write job summary
              if: always()
              run: |
                  {
                    echo "## Mutation Testing (packages/admin)"
                    echo ""
                    echo '```'
                    grep -B2 "^All files" mutation-report.log || echo "(結果テーブルを取得できませんでした。詳細はログを参照してください)"
                    echo '```'
                    echo ""
                    echo "詳細は本ジョブの \`mutation-report-admin\` artifact（HTMLレポート）を参照してください。"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-report-admin
                  path: |
                      reports/mutation/admin/
                      mutation-report.log
                  retention-days: 7
                  if-no-files-found: warn

    mutation-batch:
        runs-on: ubuntu-24.04
        # ローカル実測: packages/batch全体で855ミュータント。HTTPクライアント系テストが
        # コアより重く、1ファイル31ミュータントで1分15秒かかったケースを確認済みのため、
        # admin相当のミュータント数でもより大きめの余裕を見る。
        timeout-minutes: 45
        env:
            NODE_ENV: ci_github_actions
            CI: "true"
            TZ: jst
            HTML_FETCH_DELAY_MS: "0"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  filter: blob:none

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace
              with:
                  setup-node: "false"

            - name: Run mutation testing (packages/batch)
              run: bun run mutation:batch | tee mutation-report.log

            - name: Write job summary
              if: always()
              run: |
                  {
                    echo "## Mutation Testing (packages/batch)"
                    echo ""
                    echo '```'
                    grep -B2 "^All files" mutation-report.log || echo "(結果テーブルを取得できませんでした。詳細はログを参照してください)"
                    echo '```'
                    echo ""
                    echo "詳細は本ジョブの \`mutation-report-batch\` artifact（HTMLレポート）を参照してください。"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-report-batch
                  path: |
                      reports/mutation/batch/
                      mutation-report.log
                  retention-days: 7
                  if-no-files-found: warn

    # packages/api は他パッケージと桁違いにミュータント数が多く（全体で約4,950。うち
    # openapi/openApiSpec.ts はStryker設定側で除外済み）、単一ジョブでは実測
    # 約13.5ミュータント/分のスループットで完走に約6時間かかり、実際に150分タイムアウトで
    # 40%未達のまま打ち切られた（run 32438847810）。src配下のサブディレクトリ単位で
    # matrixに分割し、1レグあたりcore並み（20〜30分オーダー、大きいレグでも90分以内）に
    # 収める。各レグの`mutate`はstryker.api.config.jsonの`mutate`設定を`--mutate`で
    # 上書きするため、レグごとに必要なindex.ts等の除外を個別に指定している
    # （CLIの`--mutate`はconfig側のmutate配列を丸ごと置き換える仕様のため、
    # config側の`!packages/api/src/**/index.ts`等は継承されない）。
    # 例外: routerレグの`packages/api/src/index.ts`はHonoアプリのエントリポイントで
    # 実体のあるロジックを持つため、意図的に除外せず対象に含めている
    # （他サブディレクトリのバレルファイルとしてのindex.tsとは性質が異なる）。
    mutation-api:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    # 実測609ミュータント。
                    - name: controller
                      mutate: "packages/api/src/controller/**/*.ts"
                      timeout: 60
                    # 実測424ミュータント。
                    - name: usecase
                      mutate: "packages/api/src/usecase/**/*.ts"
                      timeout: 45
                    # repository/implement配下は18ファイル・943ミュータントとまとめると
                    # 重すぎるため、ファイルサイズでa/b/cの3グループに分割（実測287/352/304）。
                    - name: repository-a
                      mutate: "packages/api/src/repository/implement/raceRepository.ts,packages/api/src/repository/implement/debugRepository.ts,packages/api/src/repository/implement/favoriteRepository.ts,packages/api/src/repository/implement/backfillRepository.ts,packages/api/src/repository/implement/batchLockRepository.ts,packages/api/src/repository/implement/releaseNoteRepository.ts,packages/api/src/repository/implement/uiLayoutRepository.ts,packages/api/src/repository/implement/webPushSendRepository.ts"
                      timeout: 35
                    - name: repository-b
                      mutate: "packages/api/src/repository/implement/placeRepository.ts,packages/api/src/repository/implement/placeMapper.ts,packages/api/src/repository/implement/authRepository.ts,packages/api/src/repository/implement/playerMapper.ts,packages/api/src/repository/implement/featureFlagRepository.ts"
                      timeout: 40
                    - name: repository-c
                      mutate: "packages/api/src/repository/implement/calendarRepository.ts,packages/api/src/repository/implement/playerRepository.ts,packages/api/src/repository/implement/pushRequestRepository.ts,packages/api/src/repository/implement/pushSubscriptionRepository.ts,packages/api/src/repository/implement/raceMapper.ts"
                      timeout: 35
                    # repository/interface・utility。interface/index.tsはインターフェース
                    # 再エクスポートのみのバレルファイルのため除外（実測185ミュータント）。
                    - name: repository-shared
                      mutate: "packages/api/src/repository/utility/**/*.ts,packages/api/src/repository/interface/**/*.ts,!packages/api/src/repository/interface/index.ts"
                      timeout: 25
                    # 実測212ミュータント。
                    - name: gateway
                      mutate: "packages/api/src/gateway/**/*.ts"
                      timeout: 30
                    # 実測477ミュータント。
                    - name: utility
                      mutate: "packages/api/src/utility/**/*.ts"
                      timeout: 50
                    # di・middleware・dbをまとめた基盤層。di/index.tsはDIコンテナの
                    # 再エクスポートのみのバレルファイルのため除外（実測457ミュータント）。
                    - name: platform
                      mutate: "packages/api/src/di/**/*.ts,packages/api/src/middleware/**/*.ts,packages/api/src/db/**/*.ts,!packages/api/src/di/index.ts"
                      timeout: 50
                    # router.ts/scheduled.tsに加え、エントリポイントのindex.ts
                    # （バレルファイルではなく実体のあるロジックを持つため対象に含める）。
                    # 実測814ミュータントと最大レグのため、余裕を持って90分。
                    - name: router
                      mutate: "packages/api/src/router.ts,packages/api/src/scheduled.ts,packages/api/src/index.ts"
                      timeout: 90
        timeout-minutes: ${{ matrix.timeout }}
        env:
            NODE_ENV: ci_github_actions
            CI: "true"
            TZ: jst
            HTML_FETCH_DELAY_MS: "0"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  filter: blob:none

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace
              with:
                  setup-node: "false"

            - name: Run mutation testing (packages/api/${{ matrix.name }})
              run: bun run mutation:api -- --mutate "${{ matrix.mutate }}" | tee mutation-report.log

            - name: Write job summary
              if: always()
              run: |
                  {
                    echo "## Mutation Testing (packages/api/${{ matrix.name }})"
                    echo ""
                    echo '```'
                    grep -B2 "^All files" mutation-report.log || echo "(結果テーブルを取得できませんでした。詳細はログを参照してください)"
                    echo '```'
                    echo ""
                    echo "詳細は本ジョブの \`mutation-report-api-${{ matrix.name }}\` artifact（HTMLレポート）を参照してください。"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-report-api-${{ matrix.name }}
                  path: |
                      reports/mutation/api/
                      mutation-report.log
                  retention-days: 7
                  if-no-files-found: warn

    # 週次・無人実行のため、各mutation-<pkg>ジョブ自体が失敗（Strykerのクラッシュ・
    # タイムアウト等）してもActionsのRun一覧を人が見に行かない限り気づけない。
    # scheduled-tests.yml の report-test-failures ジョブと同じ作法（GitHub App token +
    # タイトルでdedupしたIssueを作成、復旧したら自動Close。パッケージ単位で1関数を
    # 使い回す構成も同ジョブのreport_targetパターンを踏襲）で可視化する。
    # 対象はジョブの失敗のみ（ミューテーションスコアの高低はthresholds.breakがnullのため
    # ここでは検知しない。スコアの傾向は別途 docs/tasks/test-quality-audit.md への
    # 手動トリアージで扱う）。
    report-mutation-failure:
        needs: [mutation-core, mutation-admin, mutation-batch, mutation-api]
        if: always()
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # 失敗した場合、原因（どのファイルのinstrumentation/dry-runでこけたか）を
            # Issue本文に直接埋め込むため、各ジョブがアップロードしたログartifactを
            # まとめて取得する。`pattern`で`mutation-report-*`を一括ダウンロードし、
            # artifact名ごとのサブディレクトリに展開する（download-artifact@v8の既定挙動）。
            # 該当ジョブがartifactアップロード（`if: always()`）まで到達せずに落ちた場合は
            # そのartifact自体が存在しないため、continue-on-errorで握り潰す（後段でファイルが
            # 無ければ「ログ取得不可」として扱う）。
            - name: Download mutation report logs
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: mutation-report-*
                  path: mutation-reports

            - name: Create GitHub App Token
              uses: ./.github/actions/create-github-app-token
              id: app-token
              with:
                  app-id: ${{ secrets.BOT_APP_ID }}
                  private-key: ${{ secrets.BOT_PRIVATE_KEY }}

            - name: Sync GitHub Issues for mutation job failures
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  RESULT_CORE: ${{ needs.mutation-core.result }}
                  RESULT_ADMIN: ${{ needs.mutation-admin.result }}
                  RESULT_BATCH: ${{ needs.mutation-batch.result }}
                  RESULT_API: ${{ needs.mutation-api.result }}
              run: |
                  set -uo pipefail

                  # 対象1パッケージ分の同期。サブシェル関数として定義し、内部で
                  # `set -euo pipefail`を有効にすることで、1対象で想定外のエラー
                  # （gh CLI失敗等）が起きても呼び出し元のループやスクリプト全体を止めず、
                  # 他対象の同期を継続できるようにしている（scheduled-tests.ymlと同じ設計）。
                  report_target() (
                    set -euo pipefail
                    pkg="$1"
                    result="$2"

                    # skippedはテスト失敗ではないため、既存Issueの状態も変えず何もしない
                    # （scheduled-tests.ymlのreport_targetと同じ判断基準）。
                    # 注意: scheduled-tests.ymlでは"cancelled"も対象外扱いだが、あちらは
                    # cancel-in-progress: true の並行実行で他ジョブに巻き込まれて
                    # cancelledになるケースを想定したもの。本ワークフローは
                    # `concurrency.cancel-in-progress: false`のため、cancelledは
                    # そのケースがあり得ず、タイムアウト（実際にmutation-apiが
                    # 150分タイムアウトで打ち切られた実例あり）か手動キャンセルの
                    # いずれかを意味する。どちらも見過ごしてはいけない実行基盤側の
                    # 問題のため、failureと同様にIssue化する。
                    if [ "$result" = "skipped" ]; then
                      echo "[$pkg] $result（対象外のため何もしません）"
                      exit 0
                    fi

                    title="[Test Failure] mutation-${pkg}（Mutation Testing）が失敗"
                    label="test-failure:mutation-${pkg}"

                    gh label create "test-failure" --color "B60205" \
                      --description "テスト失敗の自動起票" >/dev/null 2>&1 || true
                    gh label create "$label" --color "B60205" \
                      --description "テスト失敗 (mutation-${pkg})" >/dev/null 2>&1 || true

                    existing=$(gh issue list --state open --json number,title \
                      | jq --arg t "$title" '[.[] | select(.title == $t)] | .[0].number // empty')

                    if [ "$result" = "success" ]; then
                      if [ -n "$existing" ]; then
                        gh issue comment "$existing" --body "直近の実行（${RUN_URL}）でmutation-${pkg}ジョブが成功したため、自動的にCloseします。再発した場合は新しいIssueが作成されます。"
                        gh issue close "$existing"
                        echo "[$pkg] 復旧を確認し、Issue #$existing をCloseしました"
                      else
                        echo "[$pkg] 成功。対象Issueもなし（何もしません）"
                      fi
                      exit 0
                    fi

                    # どのファイル（instrumentation対象のsrcファイル・dry-runで落ちたテスト
                    # ファイル等）が原因かをIssue本文に直接埋め込む。「ERROR」等を含む行を
                    # 前後の文脈込みで抜き出し、見つからなければ末尾を、artifact自体が無ければ
                    # その旨を表示する（Actionsログへのクリック遷移なしで一次切り分けできる
                    # ようにするため）。
                    #
                    # mutation-apiのみsubdirectory単位のmatrixに分割されており、
                    # `mutation-report-api-<shard>`という10個のartifactが個別に存在する
                    # （`needs.mutation-api.result`はmatrix全legの集約結果のため、
                    # どのshardが失敗したかはここでは分からない。ログのartifactディレクトリを
                    # 全shard分走査し、エラーらしき行が見つかったshardのみ抜粋する）。
                    if [ "$pkg" = "api" ]; then
                      snippet=""
                      for shard_log in mutation-reports/mutation-report-api-*/mutation-report.log; do
                        [ -f "$shard_log" ] || continue
                        shard_name=$(basename "$(dirname "$shard_log")")
                        shard_snippet=$(grep -inE "error|fail|cannot|enoent" "$shard_log" -A3 -B1 | tail -c 2000) || true
                        if [ -n "$shard_snippet" ]; then
                          # 本文側で全体を単一の```コードフェンスで囲むため、ここでは
                          # ネストしたコードフェンスを作らずshard名を区切り行として挿む。
                          # printfで1行に収めているのはYAMLのブロックスカラー内で
                          # インデント無しの生改行を書くとパースが壊れるため。
                          snippet="${snippet}$(printf -- '--- %s ---\n%s\n\n' "$shard_name" "$shard_snippet")"
                        fi
                      done
                      if [ -z "$snippet" ]; then
                        snippet="(いずれのshardのログにもエラーらしき行が見つかりませんでした。ログartifact一式またはActionsの実行ログを直接確認してください)"
                      fi
                    else
                      log_file="mutation-reports/mutation-report-${pkg}/mutation-report.log"
                      if [ -f "$log_file" ]; then
                        # grepが無マッチだと終了コード1を返し、pipefail経由でset -eがスクリプト
                        # ごと落としてしまうため`|| true`で無マッチを正常系として扱う（snippetは
                        # 空文字になり、直後のフォールバックへ回る）。
                        snippet=$(grep -inE "error|fail|cannot|enoent" "$log_file" -A3 -B1 | tail -c 4000) || true
                        if [ -z "$snippet" ]; then
                          snippet=$(tail -n 60 "$log_file")
                        fi
                      else
                        snippet="(ログartifactを取得できませんでした。Actionsの実行ログを直接確認してください)"
                      fi
                    fi

                    body="## mutation-${pkg} ジョブが失敗しました

                  - ワークフロー: \`mutation-testing.yml\` / ジョブ: \`mutation-${pkg}\`
                  - 実行結果: ${result}
                  - 実行ログ: ${RUN_URL}

                  Stryker自体のクラッシュ・タイムアウト・設定エラー等、ミューテーションテストの
                  実行基盤側の問題が疑われます（ミューテーションスコアの高低ではありません。
                  \`thresholds.break\` は null のためスコアではこのジョブは失敗しません）。
                  次回のスケジュール実行またはこのIssueを見た人による \`workflow_dispatch\` 手動実行で
                  成功すれば自動でCloseされます。

                  ### ログ抜粋（原因ファイルの特定用）

                  \`\`\`
                  ${snippet}
                  \`\`\`

                  _このIssueは \`.github/workflows/mutation-testing.yml\` により自動作成されました。_"

                    if [ -n "$existing" ]; then
                      gh issue comment "$existing" --body "$body"
                      target="$existing"
                      echo "[$pkg] 既存Issue #$existing にコメントを追加しました"
                    else
                      issue_url=$(gh issue create --title "$title" --body "$body")
                      target="${issue_url##*/}"
                      echo "[$pkg] 新規Issue #$target を作成しました"
                    fi

                    gh issue edit "$target" --add-label "$label" --add-label "test-failure" \
                      || echo "::warning::[$pkg] Issue #$target へのラベル付与に失敗しました"
                  )

                  overall_status=0
                  report_target "core" "$RESULT_CORE" || overall_status=1
                  report_target "admin" "$RESULT_ADMIN" || overall_status=1
                  report_target "batch" "$RESULT_BATCH" || overall_status=1
                  report_target "api" "$RESULT_API" || overall_status=1

                  exit "$overall_status"

name: Deploy DB (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Deployment environment (development, test, production)"
    secrets:
      CLOUDFLARE_D1_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      DB_ID:
        required: true
      # CFCOST-10対応（2026-08-22）: D1バックアップをR2へアップロードするための
      # R2書き込み専用トークン。未設定でも本番デプロイ自体は止めたくないため
      # required: falseにし、アップロードステップ側をcontinue-on-errorにする
      # （graceful degradation、他の未設定シークレットと同じ方針）。
      CLOUDFLARE_R2_CI_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy-db:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy prelude (env + secrets check)
        uses: ./.github/actions/deploy-prelude
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "🔍 Validate DB Deployment Secrets"
        # SEC-043対応: secrets.*をrun:のスクリプト本文へ直接展開せず、env:経由で
        # シェル変数として渡す。
        env:
          DB_ID: ${{ secrets.DB_ID }}
        run: |
          echo "=== Cloudflare D1 Configuration ==="
          echo "Environment: ${{ inputs.environment }}"

          [ -z "$DB_ID" ] && echo "❌ DB_ID: NOT SET" || echo "✅ DB_ID: SET"

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-install-filter: ./packages/db

      # OPS-01対応: D1のマイグレーションはwrangler d1 migrations applyによる前進のみで、
      # 自動的なdown-migration（ロールバック）機構自体が存在しない（TEST_PLAN.mdが計画していた
      # 「ロールバック安全性テスト」はD1の実際の仕組みと前提が合っていなかった）。実運用での
      # 障害復旧手段は「マイグレーション適用直前のバックアップから復元する」ことになるため、
      # 適用前に必ずエクスポートを取得しCloudflare R2へ保存する。
      #
      # CFCOST-10対応（2026-08-22）: 以前はactions/upload-artifactで14日間保持していたが、
      # 人が閲覧するページではなく監査用の生データのため、GitHub Actions storageではなく
      # Cloudflare R2（race-schedule-ci-artifacts、race-schedule側のinfra/terraform/r2.tfが
      # 管理）へ移した（判断基準は.claude/docs/ci-conventions.md「成果物の永続化先」参照、
      # race-schedule側のsubmodule経由で共有）。DBが育つとPagesの1ファイル25MiB上限に
      # 将来抵触しうる点もPagesを選ばなかった理由。
      - name: Backup D1 database before migration
        working-directory: packages/db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.DB_ID }}
        run: |
          echo "💾 Backing up D1 database (${{ inputs.environment }}) before migration..."
          envsubst < wrangler.toml > wrangler.resolved.toml && mv wrangler.resolved.toml wrangler.toml
          bunx wrangler d1 export DB --remote --env ${{ inputs.environment }} --output db-backup-${{ inputs.environment }}.sql
          echo "✅ Backup completed"

      - name: "🔍 Validate Cloudflare R2 Secrets"
        uses: ./.github/actions/validate-cf-secrets
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_R2_CI_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # CLOUDFLARE_R2_CI_TOKEN未設定の間はバックアップのR2保存だけをスキップし、
      # 本番マイグレーション自体は止めない（graceful degradation）。
      - name: Upload D1 backup to Cloudflare R2
        working-directory: packages/db
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_CI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler r2 object put \
            "race-schedule-ci-artifacts/d1-backup/${{ inputs.environment }}/${{ github.run_id }}.sql" \
            --file=db-backup-${{ inputs.environment }}.sql \
            --remote

      - name: Deploy migrations to ${{ inputs.environment }}
        working-directory: packages/db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.DB_ID }}
        run: |
          echo "🚀 Deploying DB migrations to ${{ inputs.environment }} environment..."
          bunx wrangler d1 migrations apply DB --remote --env ${{ inputs.environment }}
          echo "✅ Deployment completed"

      - name: List applied migrations
        working-directory: packages/db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📋 Applied migrations:"
          bunx wrangler d1 migrations list DB --remote --env ${{ inputs.environment }}

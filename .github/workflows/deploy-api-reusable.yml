name: Deploy API (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Deployment environment (development, test, production)"
    secrets:
      CLOUDFLARE_WORKERS_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      DB_ID:
        required: true
      VAPID_PRIVATE_KEY:
        required: false
      PUSH_DISPATCH_TOKEN:
        required: false
      PUSH_AUTH_ENCRYPTION_KEY:
        required: false
      SERVICE_AUTH_TOKEN:
        required: true
      SERVICE_AUTH_TOKEN_PREVIOUS:
        required: false
      ISSUE_BOT_TOKEN:
        required: false
      CLOUDFLARE_ANALYTICS_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy prelude (env + secrets check)
        uses: ./.github/actions/deploy-prelude
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "🔍 Validate API Deployment Secrets"
        # SEC-043対応: secrets.*（特にGOOGLE_PRIVATE_KEY等の複数行PEM）をrun:の
        # スクリプト本文へ直接展開すると、値中の改行以降が別のシェルコマンドとして
        # 解釈されてしまう。env:経由でシェル変数として渡すことでこれを回避する。
        env:
          DB_ID: ${{ secrets.DB_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
          PUSH_AUTH_ENCRYPTION_KEY: ${{ secrets.PUSH_AUTH_ENCRYPTION_KEY }}
          SERVICE_AUTH_TOKEN: ${{ secrets.SERVICE_AUTH_TOKEN }}
          SERVICE_AUTH_TOKEN_PREVIOUS: ${{ secrets.SERVICE_AUTH_TOKEN_PREVIOUS }}
          ISSUE_BOT_TOKEN: ${{ secrets.ISSUE_BOT_TOKEN }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        run: |
          echo "=== Cloudflare API Configuration ==="
          echo "Environment: ${{ inputs.environment }}"

          [ -z "$DB_ID" ] && echo "❌ DB_ID: NOT SET" || echo "✅ DB_ID: SET"

          echo ""
          echo "=== CORS Configuration ==="
          [ -z "${{ vars.CORS_ALLOWED_ORIGINS }}" ] && echo "⚠️  CORS_ALLOWED_ORIGINS: NOT SET (デフォルトはlocalhostのみ許可)" || echo "✅ CORS_ALLOWED_ORIGINS: SET"

          echo ""
          echo "=== Web Push Configuration ==="
          [ -z "${{ vars.VAPID_PUBLIC_KEY }}" ] && echo "⚠️  VAPID_PUBLIC_KEY: NOT SET (Web Pushは無効のまま)" || echo "✅ VAPID_PUBLIC_KEY: SET"
          [ -z "$VAPID_PRIVATE_KEY" ] && echo "⚠️  VAPID_PRIVATE_KEY: NOT SET (Web Pushは無効のまま)" || echo "✅ VAPID_PRIVATE_KEY: SET"
          [ -z "${{ vars.VAPID_SUBJECT }}" ] && echo "⚠️  VAPID_SUBJECT: NOT SET (Web Pushは無効のまま)" || echo "✅ VAPID_SUBJECT: SET"
          [ -z "$PUSH_DISPATCH_TOKEN" ] && echo "⚠️  PUSH_DISPATCH_TOKEN: NOT SET (POST /push/dispatch の手動実行が使えない)" || echo "✅ PUSH_DISPATCH_TOKEN: SET"
          [ -z "$PUSH_AUTH_ENCRYPTION_KEY" ] && echo "⚠️  PUSH_AUTH_ENCRYPTION_KEY: NOT SET (購読authは平文のまま保存される、SEC-053)" || echo "✅ PUSH_AUTH_ENCRYPTION_KEY: SET"

          echo ""
          echo "=== Service-to-Service Auth Configuration ==="
          # Issue #2505（race-schedule）: batchパッケージのrace-scheduler移行時に
          # SERVICE_AUTH_TOKENが未設定のままデプロイが成功し、他Worker側との認証が
          # フェイルクローズ設計（SECURITY-15）により401で失敗し続けた。MAIN_API_URLと
          # 同様、未設定を検知したら確実にデプロイを失敗させる。
          if [ -z "$SERVICE_AUTH_TOKEN" ]; then
            echo "::error::SERVICE_AUTH_TOKEN が未設定です。連携先Worker側に設定されている値と完全一致する値を、Settings → Environments → ${{ inputs.environment }} → Secrets に設定してください。"
            exit 1
          fi
          echo "✅ SERVICE_AUTH_TOKEN: SET"
          [ -z "$SERVICE_AUTH_TOKEN_PREVIOUS" ] && echo "ℹ️  SERVICE_AUTH_TOKEN_PREVIOUS: NOT SET（ローテーション中のみ設定、通常は未設定でよい）" || echo "✅ SERVICE_AUTH_TOKEN_PREVIOUS: SET（ローテーション中）"

          echo ""
          echo "=== Backfill Configuration (api → scraping) ==="
          [ -z "${{ vars.SCRAPING_API_URL }}" ] && echo "❌ SCRAPING_API_URL: NOT SET (POST /admin/backfill/* が使えない)" || echo "✅ SCRAPING_API_URL: SET"

          echo ""
          echo "=== Data Freshness Check / Error Monitor Configuration (CICD-121/122) ==="
          [ -z "$ISSUE_BOT_TOKEN" ] && echo "⚠️  ISSUE_BOT_TOKEN: NOT SET (データ鮮度チェック・エラー監視のIssue通知が使えない)" || echo "✅ ISSUE_BOT_TOKEN: SET"
          [ -z "$CLOUDFLARE_ANALYTICS_API_TOKEN" ] && echo "⚠️  CLOUDFLARE_ANALYTICS_API_TOKEN: NOT SET (Cloudflareエラー監視が使えない)" || echo "✅ CLOUDFLARE_ANALYTICS_API_TOKEN: SET"

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build `packages/api`
        working-directory: packages/api
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: ./.github/actions/deploy-cloudflare-workers
        with:
          environment: ${{ inputs.environment }}
          working-directory: packages/api
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf-d1-db-id: ${{ secrets.DB_ID }}
          # 新しいシークレットが必要になったら、ここに1行足すだけでよい
          # （登録・本番反映後の検証まで deploy-cloudflare-workers action が機械的に行う）
          secrets-json: |
            {
              "CORS_ALLOWED_ORIGINS": "${{ vars.CORS_ALLOWED_ORIGINS }}",
              "VAPID_PUBLIC_KEY": "${{ vars.VAPID_PUBLIC_KEY }}",
              "VAPID_PRIVATE_KEY": "${{ secrets.VAPID_PRIVATE_KEY }}",
              "VAPID_SUBJECT": "${{ vars.VAPID_SUBJECT }}",
              "PUSH_DISPATCH_TOKEN": "${{ secrets.PUSH_DISPATCH_TOKEN }}",
              "PUSH_AUTH_ENCRYPTION_KEY": "${{ secrets.PUSH_AUTH_ENCRYPTION_KEY }}",
              "SERVICE_AUTH_TOKEN": "${{ secrets.SERVICE_AUTH_TOKEN }}",
              "SERVICE_AUTH_TOKEN_PREVIOUS": "${{ secrets.SERVICE_AUTH_TOKEN_PREVIOUS }}",
              "SCRAPING_API_URL": "${{ vars.SCRAPING_API_URL }}",
              "GITHUB_TOKEN": "${{ secrets.ISSUE_BOT_TOKEN }}",
              "CLOUDFLARE_ANALYTICS_API_TOKEN": "${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}",
              "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            }

name: Coverage on PR

# `paths:` フィルタを on.pull_request に付けると、対象外の変更（例: aidlc-docs/**
# のみのdocs PR）ではワークフロー自体が一度もトリガーされず、ブランチ保護で
# 必須指定した `coverage-and-gap` チェックがステータスを永遠に報告できなくなる
# （GitHub側で「Expected — Waiting for status to be reported」のまま止まり続け、
# 何度pushしても解消しない）。そのため、ワークフロー自体は常にトリガーし、
# `detect-changes` ジョブ（dorny/paths-filter、pull_request.yml の
# detect-changed-packages と同じ方式）で対象パス変更の有無を判定したうえで
# `coverage-and-gap` を条件付き実行する。対象外PRはジョブが `skipped` として
# 即座にステータス報告される（GitHubの必須チェック判定では skipped は
# 成功として扱われるため、docsのみのPRもブロックされない）。
on:
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: coverage-pr-${{ github.ref }}
    cancel-in-progress: true

jobs:
    detect-changes:
        # draft中はCIを起動せずGitHub Actionsの消費を抑える（task-workflow.md参照）。
        # skipされたjobのoutputsは空文字になるため、後続のcoverage-and-gapのif条件
        # （needs.detect-changes.outputs.relevant == 'true'）もfalseとなり連鎖skipされる。
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        # PRコメント投稿を行わないため pull-requests: write は不要（SEC-052対応）。
        permissions:
            contents: read
        outputs:
            relevant: ${{ steps.filter.outputs.relevant }}
        steps:
            - name: Detect relevant changes
              id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      relevant:
                          - "packages/**"
                          - "tests/**"
                          - "scripts/test-gap-analysis.ts"
                          - "scripts/build-gap-comment.ts"
                          - "scripts/check-patch-coverage.ts"
                          - "scripts/check-coverage-baseline.ts"
                          - "package.json"
                          - ".github/workflows/coverage-pr.yml"

    coverage-and-gap:
        needs: [ detect-changes ]
        if: needs.detect-changes.outputs.relevant == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        # CLOUDFLARE_PAGES_API_TOKEN/CLOUDFLARE_ACCOUNT_IDがGitHub Environment（production）に
        # スコープされているため、Cloudflare Pagesへのデプロイを行う他ジョブ
        # （widgetbook-preview等）と同様environmentを明示する。フォークPRはGitHub側の
        # 制約でどのみちenvironment secretsを取得できないが、本ジョブ内の該当ステップも
        # 念のため明示的にskipする（下記 head.repo.full_name チェック）。
        environment: production
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # CICD-106は「PRコミット数+1」の可変depthを試したところ、同じ発想の
                  # secret-scan.yml（CICD-105）側でCI実行時にshallow clone起因と
                  # 疑われるgit log range異常（無関係な過去差分まで含まれる）が発生した。
                  # このjobのgit diff --name-only(base..head)も同じ merge ref 上の
                  # 範囲取得に依存しており、同じリスクを負う可能性があるため、
                  # 原因を精査しきれるまでは安全側のfetch-depth:0（全履歴取得）に戻す。
                  fetch-depth: 0

            - name: Setup workspace
              uses: ./.github/actions/setup-workspace
              with:
                  setup-node: 'false'

            - name: Run tests with coverage
              id: test
              # CICD-06: `bun run test` は内部で `;` 連結された表示用スクリプト
              # （filter-coverage-report.ts）が後続するため、テストが失敗しても
              # exit code 0 を返す（package.json 参照）。生の `bun test` コマンドを
              # 直接実行することで、このステップの outcome が実際のテスト結果を反映する。
              # continue-on-error: 後続のgap分析・PRコメント投稿を先に完了させたいため
              # ここでは止めない。最終判定は最後の Fail if blocking ステップで行う。
              run: NODE_ENV=ci_local TZ=jst HTML_FETCH_DELAY_MS=0 bun test --coverage --path-ignore-patterns '**/test/integration/system/**'
              continue-on-error: true

            - name: Setup LCOV
              uses: hrishikesh-kadam/setup-lcov@6c1aa0cc9e1c02f9f58f01ac599f1064ccc83470 # v1.1.0

            # 行単位ハイライト付きのHTMLレポートを genhtml（上記Setup LCOVで導入済みの
            # lcov純正コマンド）で生成し、Cloudflare Pagesへホストする（2026-08-14）。
            # 以前は zgosalvez/github-actions-report-lcov を使っていたが、
            # ①v7.2.0で「Files Changed Coverage」テーブルの表示が壊れるバグを踏んだ
            # （PR #2509、ci-conventions.md参照）、②サードパーティのバージョンアップ
            # だけで壊れうる依存を1つ減らしたい、の2点から自前実装へ置き換えた。
            # widgetbook-preview（pull_request.yml）と同じ「フォークPRでは secrets が
            # 渡らないため明示的にskip」パターンを踏襲する。
            - name: Generate HTML coverage report
              run: genhtml coverage/lcov.info -o coverage-html

            - name: "🔍 Validate Cloudflare Secrets"
              if: github.event.pull_request.head.repo.full_name == github.repository
              uses: ./.github/actions/validate-cf-secrets
              with:
                  cloudflare-api-token: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
                  cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Ensure Cloudflare Pages project exists
              if: github.event.pull_request.head.repo.full_name == github.repository
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              # 初回のみプロジェクトが存在しないため作成する。2回目以降は
              # 「already exists」エラーになるため `|| true` で無視する
              # （race-schedule-ci-report/race-schedule-widgetbookと同じ冪等化パターン）。
              run: |
                  bunx wrangler pages project create race-schedule-coverage \
                    --production-branch main \
                    || true

            - name: Deploy HTML coverage report to Cloudflare Pages
              id: deploy-coverage
              if: github.event.pull_request.head.repo.full_name == github.repository
              # SEC-041対応: ref名（PR作成者が制御できる値）を`run:`のスクリプト本文へ
              # 直接展開せずenv:経由でシェル変数として渡す（widgetbook-previewと同じ方針）。
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  BRANCH_NAME: ${{ github.head_ref }}
              run: |
                  bunx wrangler pages deploy coverage-html \
                    --project-name race-schedule-coverage \
                    --branch "$BRANCH_NAME" | tee /tmp/wrangler-deploy-output.txt

                  # wranglerの出力から実際のデプロイURLを拾う（widgetbook-previewと同じ手法）。
                  DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev[^[:space:]]*' /tmp/wrangler-deploy-output.txt | tail -1)
                  echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

            - name: Comment coverage HTML report URL on PR
              if: steps.deploy-coverage.outputs.deploy-url != ''
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: coverage-html-report
                  message: |
                      📊 行単位カバレッジレポート（HTML）: ${{ steps.deploy-coverage.outputs.deploy-url }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Test Gap Analysis (JSON)
              id: gap
              # CILOG-004/021: 生JSON全文（head -200）をそのままログへ流すと最も
              # 「めっちゃ出る」原因になっていたため、::group:: での折りたたみに加え
              # 内容自体も「対象ファイル数 + 代表例5件」の要約へ圧縮する。詳細な全件は
              # gap.json 自体（後続ステップ・PRコメントで利用）に残っており失われない。
              run: |
                  bun scripts/test-gap-analysis.ts --json > gap.json
                  echo "::group::gap.json summary"
                  jq -r '[.results[].gapSrcFiles[]] | "gap files: \(length) 件"' gap.json
                  jq -r '.results[] | select(.gapSrcFiles | length > 0) | "  \(.package): \(.gapSrcFiles | length) 件"' gap.json
                  echo "代表例（先頭5件）:"
                  jq -r '[.results[].gapSrcFiles[]] | .[0:5][] | "  \(.file) (funcs=\(.funcsPct)% lines=\(.linesPct)%)"' gap.json
                  echo "::endgroup::"

            - name: Get changed files
              id: changed-files
              run: |
                  git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt
                  cat changed-files.txt

            - name: Check patch coverage
              id: patch-coverage
              # このPRで変更されたファイルにC0/C1カバレッジ100%未満のものが無いかを判定する。
              # Codecov の patch coverage（変更行カバレッジ100%必須）ゲート相当を、外部
              # サービス（Codecovのトークン管理）に依存せず自前で実現する。
              run: bun scripts/check-patch-coverage.ts gap.json changed-files.txt
              continue-on-error: true

            - name: Build PR comment
              id: build_comment
              run: |
                  TEST_FAILED_FLAG=""
                  if [ "${{ steps.test.outcome }}" != "success" ]; then
                    TEST_FAILED_FLAG="--test-failed"
                  fi
                  PATCH_FAILED_FLAG=""
                  if [ "${{ steps.patch-coverage.outcome }}" != "success" ]; then
                    PATCH_FAILED_FLAG="--patch-failed"
                  fi
                  # SEC-048対応: 固定の"EOF"区切り子は出力内容に同名の行が混入すると
                  # 途中で終端しGITHUB_OUTPUTへの任意キー注入を許しうるため、ランダムな
                  # 区切り子を使う。
                  DELIMITER="$(openssl rand -hex 16)"
                  {
                    echo "comment<<$DELIMITER"
                    bun scripts/build-gap-comment.ts gap.json $TEST_FAILED_FLAG $PATCH_FAILED_FLAG
                    echo "$DELIMITER"
                  } >> "$GITHUB_OUTPUT"

            - name: Comment on PR
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: test-gap-report
                  message: ${{ steps.build_comment.outputs.comment }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Fail if tests or patch coverage failed
              # 前段のステップが失敗していてもこの判定は必ず評価する必要があるため、
              # デフォルトの success() ではなく !cancelled() を使う。
              if: ${{ !cancelled() && (steps.test.outcome != 'success' || steps.patch-coverage.outcome != 'success') }}
              run: |
                  echo "::error::Run tests with coverage: ${{ steps.test.outcome }}"
                  echo "::error::Check patch coverage: ${{ steps.patch-coverage.outcome }}"
                  exit 1
